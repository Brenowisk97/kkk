<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Moranguete 🍓</title>

    <style>

        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #conteudo {
            background: linear-gradient(
                135deg,
                #ff8a95,
                #ff5f73,
                #d9304f
            );

            width: 100vw;
            height: 100vh;

            position: fixed;
            top: 0;
            left: 0;

            text-align: center;
        }

        h2 {
            color: white;
            font-size: 34px;
            margin-top: 90px;

            text-shadow:
                0 3px 10px rgba(0,0,0,0.25);

            position: relative;
            z-index: 10;
        }


        /* IMAGENS */

        .foto {
            position: absolute;

            width: 220px;
            height: 390px;

            object-fit: cover;

            border-radius: 20px;

            box-shadow:
                0 15px 30px rgba(0,0,0,0.30);

            border:
                3px solid rgba(255,255,255,0.7);
        }


        /* MÉDICA */

        #medica {
            left: 35px;
            top: 80px;

            transform: rotate(-4deg);
        }


        /* ACADEMIA */

        #gym {
            right: 35px;
            top: 80px;

            transform: rotate(4deg);
        }


        /* CAFÉ */

        #cafe {
            left: 50%;
            bottom: -100px;

            transform:
                translateX(-50%)
                rotate(-2deg);
        }


        /* BOTÕES */

        .botoes {
            position: relative;

            margin: 50px auto 0;

            width: 200px;
            height: 60px;

            z-index: 20;
        }

        .btn {
            background: black;
            color: white;

            border: none;

            padding: 12px;

            width: 90px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;

            font-size: 15px;
        }


        #sim {
            background: #b9153d;

            position: fixed;

            left: calc(50% - 100px);
        }


        #nao {
            position: absolute;
        }


        /* FRASES DO NÃO */

        #mensagem {
            color: white;

            font-size: 19px;

            font-weight: bold;

            margin-top: 80px;

            position: relative;

            z-index: 30;

            text-shadow:
                0 2px 6px rgba(0,0,0,0.25);
        }


        /* FOGOS */

        #fogos {
            position: fixed;

            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            z-index: 100;

            display: none;

            pointer-events: none;
        }


        /* FUNDO APÓS O SIM */

        #overlay {
            position: fixed;

            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            background:
                rgba(40,0,10,0.45);

            display: none;

            z-index: 90;
        }


        /* MENSAGEM FINAL */

        #final {
            position: fixed;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            color: white;

            font-size: 55px;

            font-weight: bold;

            z-index: 120;

            display: none;

            text-align: center;

            text-shadow:
                0 5px 20px rgba(0,0,0,0.5);
        }


        /* CELULAR */

        @media (max-width: 800px) {

            h2 {
                font-size: 26px;
                margin-top: 50px;
                padding: 0 25px;
            }

            .foto {
                width: 130px;
                height: 230px;
            }

            #medica {
                left: 10px;
                top: 150px;
            }

            #gym {
                right: 10px;
                top: 150px;
            }

            #cafe {
                width: 150px;
                height: 265px;

                bottom: -80px;
            }

            #final {
                font-size: 38px;
                width: 90%;
            }

        }

    </style>

</head>


<body>


<div id="conteudo">


    <!-- MÉDICA -->

    <img
        id="medica"
        class="foto"
        src="Moranguetemedica.png"
        alt="Moranguete médica"
    >


    <!-- ACADEMIA -->

    <img
        id="gym"
        class="foto"
        src="Moranguetegymr.png"
        alt="Moranguete academia"
    >


    <!-- CAFÉ -->

    <img
        id="cafe"
        class="foto"
        src="moranguetecafe.png"
        alt="Moranguete café"
    >



    <h2>
        Moranguete, aceita sair comigo esse sábado? 🍓❤️
    </h2>



    <div class="botoes">


        <button
            id="sim"
            class="btn"
            onclick="sim()"
        >
            SIM
        </button>


        <button
            id="nao"
            class="btn"
            onclick="desvia(this)"
            onmouseover="desvia(this)"
        >
            NÃO
        </button>


    </div>



    <p id="mensagem"></p>


</div>



<div id="overlay"></div>


<canvas id="fogos"></canvas>


<div id="final">

    Então temos um encontro 🍓❤️

</div>



<script>


const frases = [

    "Tem certeza? 🤨",

    "Pensa melhor... 🍓",

    "Você não vai conseguir clicar aí 😂",

    "Acho que você queria clicar no SIM 👀",

    "Para de insistir no NÃO 😭",

    "Moranguete, colabora comigo 🍓❤️",

    "O SIM tá paradinho ali...",

    "Já deu pra entender que NÃO não é opção 😂"

];


let tentativas = 0;



/* BOTÃO NÃO FOGE */

function desvia(btn) {


    btn.style.position =
        "absolute";


    btn.style.bottom =
        geraPosicao(10, 90);


    btn.style.left =
        geraPosicao(10, 90);



    document
        .getElementById("mensagem")
        .innerText =
        frases[
            tentativas
            % frases.length
        ];


    tentativas++;


}



/* POSIÇÃO ALEATÓRIA */

function geraPosicao(min, max) {


    return (

        Math.random()

        * (max - min)

        + min

    ) + "%";


}



/* CLICOU SIM */

function sim() {


    document
        .getElementById("overlay")
        .style.display =
        "block";


    document
        .getElementById("final")
        .style.display =
        "block";


    tocarSomFogos();

    iniciarFogos();



    /* ABRE A MÚSICA APÓS 5 SEGUNDOS */

    setTimeout(() => {


        location.href =
        "https://music.youtube.com/watch?v=izGwDsrQ1eQ";


    }, 5000);


}



/* SOM DOS FOGOS */

function tocarSomFogos() {


    const AudioCtx =
        window.AudioContext
        || window.webkitAudioContext;


    const audio =
        new AudioCtx();



    function boom(delay) {


        const tempo =
            audio.currentTime
            + delay;



        const osc =
            audio.createOscillator();


        const gain =
            audio.createGain();



        osc.type =
            "sine";


        osc.frequency
            .setValueAtTime(
                90,
                tempo
            );


        osc.frequency
            .exponentialRampToValueAtTime(
                35,
                tempo + 0.5
            );



        gain.gain
            .setValueAtTime(
                0.5,
                tempo
            );


        gain.gain
            .exponentialRampToValueAtTime(
                0.001,
                tempo + 0.7
            );



        osc.connect(gain);

        gain.connect(
            audio.destination
        );


        osc.start(tempo);

        osc.stop(
            tempo + 0.7
        );

    }



    boom(0);

    boom(0.6);

    boom(1.2);

    boom(1.8);

    boom(2.4);


}



/* FOGOS */

function iniciarFogos() {


    const canvas =
        document
        .getElementById("fogos");


    const ctx =
        canvas.getContext("2d");


    canvas.width =
        window.innerWidth;


    canvas.height =
        window.innerHeight;


    canvas.style.display =
        "block";



    const particulas = [];


    const cores = [

        "#ffffff",

        "#ff5577",

        "#ffd700",

        "#00ffd5",

        "#ff99aa"

    ];



    function explosao(x, y) {


        for (
            let i = 0;
            i < 80;
            i++
        ) {


            const angulo =
                Math.random()
                * Math.PI
                * 2;


            const velocidade =
                Math.random()
                * 6
                + 2;



            particulas.push({


                x: x,

                y: y,


                vx:
                    Math.cos(angulo)
                    * velocidade,


                vy:
                    Math.sin(angulo)
                    * velocidade,


                vida: 100,


                cor:
                    cores[
                        Math.floor(
                            Math.random()
                            * cores.length
                        )
                    ]


            });


        }


    }



    let quantidade =
        0;



    const intervalo =
        setInterval(() => {


            explosao(


                Math.random()
                * canvas.width,


                Math.random()
                * canvas.height
                * 0.65


            );


            quantidade++;


            if (
                quantidade >= 10
            ) {


                clearInterval(
                    intervalo
                );


            }


        }, 300);



    function animar() {


        ctx.fillStyle =
            "rgba(0,0,0,0.15)";


        ctx.fillRect(

            0,

            0,

            canvas.width,

            canvas.height

        );



        particulas.forEach(
            p => {


                p.x += p.vx;


                p.y += p.vy;


                p.vy += 0.04;


                p.vida--;



                ctx.globalAlpha =
                    p.vida / 100;


                ctx.fillStyle =
                    p.cor;


                ctx.beginPath();


                ctx.arc(

                    p.x,

                    p.y,

                    2.5,

                    0,

                    Math.PI * 2

                );


                ctx.fill();


            }
        );



        ctx.globalAlpha =
            1;



        if (

            particulas.some(
                p =>
                p.vida > 0
            )

            ||

            quantidade < 10

        ) {


            requestAnimationFrame(
                animar
            );


        }


    }



    animar();


}


</script>


</body>

</html>
