<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Moranguete 🍓</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #conteudo {
            background: linear-gradient(
                135deg,
                #ff8a95,
                #ff5f73,
                #d9304f
            );

            width: 100vw;
            height: 100vh;

            position: fixed;
            top: 0;
            left: 0;

            text-align: center;
        }


        /* =========================
           TÍTULO
        ========================== */

        h2 {
            color: white;
            font-size: 34px;

            margin-top: 55px;
            padding: 0 20px;

            position: relative;

            z-index: 30;

            text-shadow:
                0 3px 10px rgba(0,0,0,0.3);
        }


        /* =========================
           IMAGENS DA MORANGUETE
        ========================== */

        .foto {
            position: absolute;

            width: 300px;
            height: 530px;

            object-fit: cover;

            border-radius: 22px;

            border:
                3px solid rgba(255,255,255,0.75);

            box-shadow:
                0 15px 35px rgba(0,0,0,0.32);

            z-index: 3;
        }


        /* MÉDICA */

        #medica {
            left: 25px;

            top: 50%;

            transform:
                translateY(-50%)
                rotate(-3deg);
        }


        /* ACADEMIA */

        #gym {
            right: 25px;

            top: 50%;

            transform:
                translateY(-50%)
                rotate(3deg);
        }


        /* CAFÉ */

        #cafe {
            left: 50%;

            bottom: 15px;

            width: 270px;
            height: 480px;

            transform:
                translateX(-50%)
                rotate(-2deg);

            z-index: 2;
        }


        /* =========================
           DENGO PERCORRENDO A TELA
        ========================== */

        #dengo {
            position: fixed;

            width: 115px;
            height: auto;

            left: 2%;
            top: 3%;

            z-index: 15;

            pointer-events: none;

            filter:
                drop-shadow(
                    0 8px 10px rgba(0,0,0,0.28)
                );

            animation:
                dengoPasseando
                12s
                linear
                infinite;
        }


        @keyframes dengoPasseando {

            /* SUPERIOR ESQUERDO */

            0% {
                left: 2%;
                top: 3%;

                transform:
                    rotate(-7deg);
            }


            /* SUPERIOR DIREITO */

            25% {
                left: calc(98% - 115px);
                top: 3%;

                transform:
                    rotate(7deg);
            }


            /* INFERIOR DIREITO */

            50% {
                left: calc(98% - 115px);
                top: calc(97% - 150px);

                transform:
                    rotate(-7deg);
            }


            /* INFERIOR ESQUERDO */

            75% {
                left: 2%;
                top: calc(97% - 150px);

                transform:
                    rotate(7deg);
            }


            /* VOLTA AO INÍCIO */

            100% {
                left: 2%;
                top: 3%;

                transform:
                    rotate(-7deg);
            }

        }


        /* =========================
           BOTÕES
        ========================== */

        .botoes {
            position: relative;

            width: 210px;
            height: 70px;

            margin: 55px auto 0;

            z-index: 40;
        }


        .btn {
            background: black;
            color: white;

            border: none;

            padding: 12px;

            width: 90px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 15px;

            font-weight: bold;

            box-shadow:
                0 6px 15px rgba(0,0,0,0.25);
        }


        #sim {
            background: #b9153d;

            position: absolute;

            left: 0;

            z-index: 40;
        }


        #nao {
            position: absolute;

            right: 0;

            z-index: 200;

            transition:
                left 0.08s,
                top 0.08s;
        }


        /* =========================
           FRASES DO NÃO
        ========================== */

        #mensagem {
            color: white;

            font-size: 19px;

            font-weight: bold;

            margin-top: 85px;

            position: relative;

            z-index: 30;

            text-shadow:
                0 2px 6px rgba(0,0,0,0.30);
        }


        /* =========================
           FOGOS
        ========================== */

        #fogos {
            position: fixed;

            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            display: none;

            z-index: 100;

            pointer-events: none;
        }


        /* =========================
           OVERLAY FINAL
        ========================== */

        #overlay {
            position: fixed;

            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            background:
                rgba(40,0,10,0.48);

            display: none;

            z-index: 90;

            pointer-events: none;
        }


        /* =========================
           MENSAGEM FINAL
        ========================== */

        #final {
            position: fixed;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            color: white;

            font-size: 52px;

            font-weight: bold;

            text-align: center;

            width: 90%;

            display: none;

            z-index: 120;

            text-shadow:
                0 5px 20px rgba(0,0,0,0.55);
        }


        /* =========================
           CELULAR
        ========================== */

        @media (max-width: 800px) {

            h2 {
                font-size: 25px;

                margin-top: 28px;

                padding: 0 18px;
            }


            .foto {
                width: 155px;
                height: 275px;

                border-radius: 16px;
            }


            #medica {
                left: 5px;

                top: 48%;
            }


            #gym {
                right: 5px;

                top: 48%;
            }


            #cafe {
                width: 150px;
                height: 265px;

                left: 50%;

                bottom: 12px;
            }


            /* DENGO MENOR NO CELULAR */

            #dengo {
                width: 75px;

                animation-duration: 10s;
            }


            @keyframes dengoPasseando {

                0% {
                    left: 2%;
                    top: 2%;

                    transform:
                        rotate(-7deg);
                }


                25% {
                    left: calc(98% - 75px);
                    top: 2%;

                    transform:
                        rotate(7deg);
                }


                50% {
                    left: calc(98% - 75px);
                    top: calc(98% - 100px);

                    transform:
                        rotate(-7deg);
                }


                75% {
                    left: 2%;
                    top: calc(98% - 100px);

                    transform:
                        rotate(7deg);
                }


                100% {
                    left: 2%;
                    top: 2%;

                    transform:
                        rotate(-7deg);
                }

            }


            .botoes {
                margin-top: 35px;
            }


            #mensagem {
                font-size: 16px;

                margin-top: 75px;

                padding: 0 15px;
            }


            #final {
                font-size: 36px;
            }

        }

    </style>

</head>


<body>


<div id="conteudo">


    <!-- DENGO VOANDO PELA TELA -->

    <img
        id="dengo"
        src="dengobanana.png"
        alt="Dengo"
    >



    <!-- MORANGUETE MÉDICA -->

    <img
        id="medica"
        class="foto"
        src="Moranguetemedica.png"
        alt="Moranguete médica"
    >



    <!-- MORANGUETE ACADEMIA -->

    <img
        id="gym"
        class="foto"
        src="Moranguetegymr.png"
        alt="Moranguete academia"
    >



    <!-- MORANGUETE CAFÉ -->

    <img
        id="cafe"
        class="foto"
        src="moranguetecafe.png"
        alt="Moranguete café"
    >



    <!-- PERGUNTA -->

    <h2>
        Moranguete, aceita sair comigo esse sábado? 🍓❤️
    </h2>



    <!-- BOTÕES -->

    <div class="botoes">


        <button
            id="sim"
            class="btn"
            onclick="sim()"
        >
            SIM
        </button>


        <button
            id="nao"
            class="btn"
            onmouseover="desvia(this)"
            onclick="desvia(this)"
        >
            NÃO
        </button>


    </div>



    <!-- FRASES -->

    <p id="mensagem"></p>


</div>



<!-- TELA FINAL -->

<div id="overlay"></div>


<canvas id="fogos"></canvas>


<div id="final">
    Então temos um encontro 🍓❤️
</div>



<script>


/* =========================
   FRASES DO NÃO
========================= */

const frases = [

    "Tem certeza? 🤨",

    "Pensa melhor... 🍓",

    "Você não vai conseguir clicar aí 😂",

    "Acho que você queria clicar no SIM 👀",

    "Moranguete, pensa com carinho 😌",

    "Não foi dessa vez 😂",

    "Esse botão é meio tímido...",

    "Tá insistindo mesmo? 👀",

    "O SIM continua paradinho ali ❤️",

    "Quase! 😂",

    "Moranguete, colabora comigo 🍓",

    "Esse NÃO tá rápido hoje...",

    "Você chegou perto dessa vez 😂",

    "Mais uma tentativa? 👀",

    "Esse botão claramente não quer ser clicado",

    "Acho que o universo tá dando um sinal 🍓",

    "Vai cansar antes dele 😂",

    "Olha o SIM ali do lado... 👀",

    "Você ainda tá tentando? 😂",

    "Tá ficando pessoal já 🍓",

    "Boa tentativa 😌",

    "Esse NÃO treinou cardio hoje 😂",

    "Talvez seja melhor tentar o outro botão ❤️",

    "Moranguete... 😂",

    "Quase pegou! Quase..."

];


let tentativas = 0;



/* =========================
   BOTÃO NÃO FOGE
========================= */

function desvia(btn) {


    /*
       FIXED permite que o botão
       percorra a tela inteira.
    */

    btn.style.position =
        "fixed";


    const margem =
        25;


    const larguraBotao =
        btn.offsetWidth;


    const alturaBotao =
        btn.offsetHeight;


    const maxX =
        window.innerWidth
        - larguraBotao
        - margem;


    const maxY =
        window.innerHeight
        - alturaBotao
        - margem;



    let novoX;

    let novoY;


    const posicaoAtual =
        btn.getBoundingClientRect();


    let tentativasPosicao =
        0;



    /*
       PROCURA UMA POSIÇÃO DISTANTE
       DA POSIÇÃO ANTERIOR
    */

    do {


        novoX =
            margem
            + Math.random()
            * (maxX - margem);


        novoY =
            margem
            + Math.random()
            * (maxY - margem);


        tentativasPosicao++;


    } while (

        Math.hypot(

            novoX
            - posicaoAtual.left,

            novoY
            - posicaoAtual.top

        ) < 300

        &&

        tentativasPosicao < 20

    );



    btn.style.left =
        novoX + "px";


    btn.style.top =
        novoY + "px";


    btn.style.right =
        "auto";


    btn.style.bottom =
        "auto";



    /* MUDA A FRASE */

    document
        .getElementById("mensagem")
        .innerText =
        frases[
            tentativas
            % frases.length
        ];


    tentativas++;

}



/* =========================
   CLICOU NO SIM
========================= */

function sim() {


    document
        .getElementById("overlay")
        .style.display =
        "block";


    document
        .getElementById("final")
        .style.display =
        "block";


    tocarSomFogos();

    iniciarFogos();



    /*
       ABRE A MÚSICA
       APÓS 5 SEGUNDOS
    */

    setTimeout(() => {


        location.href =
        "https://music.youtube.com/watch?v=izGwDsrQ1eQ";


    }, 5000);

}



/* =========================
   SOM DOS FOGOS
========================= */

function tocarSomFogos() {


    const AudioCtx =
        window.AudioContext
        || window.webkitAudioContext;


    const audio =
        new AudioCtx();



    function boom(delay) {


        const tempo =
            audio.currentTime
            + delay;


        const osc =
            audio.createOscillator();


        const gain =
            audio.createGain();



        osc.type =
            "sine";


        osc.frequency
            .setValueAtTime(
                90,
                tempo
            );


        osc.frequency
            .exponentialRampToValueAtTime(
                35,
                tempo + 0.5
            );


        gain.gain
            .setValueAtTime(
                0.5,
                tempo
            );


        gain.gain
            .exponentialRampToValueAtTime(
                0.001,
                tempo + 0.7
            );


        osc.connect(gain);


        gain.connect(
            audio.destination
        );


        osc.start(tempo);


        osc.stop(
            tempo + 0.7
        );

    }



    boom(0);

    boom(0.5);

    boom(1);

    boom(1.5);

    boom(2);

    boom(2.5);

}



/* =========================
   FOGOS
========================= */

function iniciarFogos() {


    const canvas =
        document
        .getElementById("fogos");


    const ctx =
        canvas.getContext("2d");


    canvas.width =
        window.innerWidth;


    canvas.height =
        window.innerHeight;


    canvas.style.display =
        "block";


    const particulas =
        [];


    const cores = [

        "#ffffff",

        "#ff5577",

        "#ffd700",

        "#00ffd5",

        "#ff99aa"

    ];



    function explosao(x, y) {


        for (
            let i = 0;
            i < 80;
            i++
        ) {


            const angulo =
                Math.random()
                * Math.PI
                * 2;


            const velocidade =
                Math.random()
                * 6
                + 2;



            particulas.push({

                x: x,

                y: y,

                vx:
                    Math.cos(angulo)
                    * velocidade,

                vy:
                    Math.sin(angulo)
                    * velocidade,

                vida:
                    100,

                cor:
                    cores[
                        Math.floor(
                            Math.random()
                            * cores.length
                        )
                    ]

            });

        }

    }



    let quantidade =
        0;



    const intervalo =
        setInterval(() => {


            explosao(

                Math.random()
                * canvas.width,

                Math.random()
                * canvas.height
                * 0.65

            );


            quantidade++;


            if (
                quantidade >= 10
            ) {


                clearInterval(
                    intervalo
                );

            }


        }, 300);



    function animar() {


        ctx.fillStyle =
            "rgba(0,0,0,0.15)";


        ctx.fillRect(

            0,

            0,

            canvas.width,

            canvas.height

        );



        for (
            let i =
                particulas.length - 1;

            i >= 0;

            i--
        ) {


            const p =
                particulas[i];


            p.x += p.vx;

            p.y += p.vy;


            p.vy +=
                0.04;


            p.vida--;



            ctx.globalAlpha =
                p.vida / 100;


            ctx.fillStyle =
                p.cor;


            ctx.beginPath();


            ctx.arc(

                p.x,

                p.y,

                2.5,

                0,

                Math.PI * 2

            );


            ctx.fill();



            if (
                p.vida <= 0
            ) {


                particulas.splice(
                    i,
                    1
                );

            }

        }



        ctx.globalAlpha =
            1;



        if (

            particulas.length > 0

            ||

            quantidade < 10

        ) {


            requestAnimationFrame(
                animar
            );

        }

    }



    animar();

}


</script>


</body>

</html>
